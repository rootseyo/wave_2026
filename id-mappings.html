        function renderTable() {
            const headerEl = document.getElementById("tableHeader");
            const bodyEl = document.getElementById("tableBody");
            
            if (rawData.length === 0) {
                headerEl.innerHTML = "<th>No Data</th>";
                bodyEl.innerHTML = "<tr><td style='text-align:center;'>No ID mapping records found in CSV.</td></tr>";
                return;
            }

            const headers = Object.keys(rawData[0]);
            headerEl.innerHTML = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');

            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageItems = filteredData.slice(start, end);

            if (pageItems.length === 0) {
                bodyEl.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; padding: 24px; color: var(--text-sub);">No matching records found.</td></tr>`;

                bodyEl.innerHTML = pageItems.map(row => {
                    return `<tr>${headers.map(h => {

                    }).join('')}</tr>`;
                }).join('');
            }

            document.getElementById("pageInfo").innerText = 
                filteredData.length > 0 
                ? `Showing ${start + 1} to ${Math.min(end, filteredData.length)} of ${filteredData.length.toLocaleString()} entries`

            document.getElementById("nextBtn").disabled = end >= filteredData.length;
        }

        function filterData() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const selectedType = document.getElementById("typeFilter").value;

            filteredData = rawData.filter(row => {
                const matchesType = !selectedType || Object.values(row).some(v => v === selectedType);
                const matchesSearch = !query || Object.values(row).some(v => String(v).toLowerCase().includes(query));
                return matchesType && matchesSearch;
            });

            currentPage = 1;
            renderTable();
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        function convertJql() {
            const sourceJql = document.getElementById("jqlInput").value;
            const migratedJql = sourceJql.replace(/cf\[(\d+)\]/gi, (match, serverId) => {
                const cloudId = customFieldMappings[serverId];
                return cloudId ? `cf[${cloudId}]` : match;
            });
            document.getElementById("jqlOutput").value = migratedJql;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
